[project]
name = "cloud-investigator"
version = "0.1.0"
description = "AI-CLOUD-INVESTIGATION — read-only agentic cloud investigation assistant (Step 0 offline spike)"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2.60",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_investigator"]
