[project]
name = "cloud-investigator"
version = "0.1.0"
description = "AI-CLOUD-INVESTIGATION — read-only agentic cloud investigation assistant (Step 0 offline spike)"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2.60",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "psycopg[binary]>=3.3.9",
    "langgraph-checkpoint-postgres>=3.2.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_investigator"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires the running compose stack (make up); run via `make test-integration`",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
