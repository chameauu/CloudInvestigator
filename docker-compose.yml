# Local dev stack: Postgres 18 + pgvector, one service.
# Credentials/DB names must stay in sync with cloud_investigator.config
# DEFAULT_DATABASE_URL (postgresql://cloudinvestigator:cloudinvestigator@localhost:5432/cloudinvestigator)
# — tests/contract/test_infra.py asserts that invariant.
#
# make up    → build + start + wait until DATABASE_URL accepts connections
# make down  → stop, keep the data volume
# make reset → stop and delete the data volume

services:
  db:
    build:
      context: docker
      dockerfile: pgvector.Dockerfile
    environment:
      POSTGRES_USER: cloudinvestigator
      POSTGRES_PASSWORD: cloudinvestigator
      POSTGRES_DB: cloudinvestigator
    ports:
      - "5432:5432"
    volumes:
      # PG18 images expect a single mount at /var/lib/postgresql (data lands in
      # the versioned subdirectory); mounting the data dir directly is rejected
      # by the 18+ entrypoint.
      - cloudinvestigator_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudinvestigator"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  cloudinvestigator_pgdata:
