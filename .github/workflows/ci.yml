name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline gate (lint, unit, contract, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src scripts tests

      - name: Format check
        run: uv run ruff format --check src scripts tests

      - name: Unit + contract tests (deterministic, no network, no containers)
        run: uv run pytest tests/unit tests/contract -q

      - name: End-to-end smoke (recorded cassette, no credentials, no keys)
        run: uv run python scripts/smoke.py

      - name: Eval harness (golden replays — accuracy, citations, determinism)
        run: uv run python scripts/run_evals.py

  integration:
    name: Integration gate (Postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start local stack (builds the pgvector image)
        run: make up

      - name: Migrate schema and seed corpus
        run: make seed

      # By design this job FAILS when the database is unreachable; skipping is
      # not an accepted outcome anywhere in the suite.
      - name: Integration tests
        run: make test-integration

      - name: Stop local stack
        if: always()
        run: make down
